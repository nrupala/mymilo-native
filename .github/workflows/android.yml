name: Build Android APK (native)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # On-device engine (v0.13.0): NDK + CMake for the
      # llama.cpp JNI build, and llama.cpp itself cloned at
      # a pinned tag — never vendored into this repo. The
      # runner image already carries the Android SDK, so
      # sdkmanager is used directly.
      - name: Install NDK + CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch llama.cpp (pinned b11541)
        run: git clone --depth 1 --branch b11541 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # Release signing key (v0.6.0): stored as repository secrets,
      # decoded to a temp file for this job only, never logged.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.MYMILO_KEYSTORE_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/mymilo-release.p12"
          test -s "$RUNNER_TEMP/mymilo-release.p12"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          MYMILO_BUILD_NUMBER: ${{ github.run_number }}
          MYMILO_KEYSTORE: ${{ runner.temp }}/mymilo-release.p12
          MYMILO_KEYSTORE_PASSWORD: ${{ secrets.MYMILO_KEYSTORE_PASSWORD }}
          MYMILO_KEY_ALIAS: mymilo
          MYMILO_KEY_PASSWORD: ${{ secrets.MYMILO_KEYSTORE_PASSWORD }}

      # Ship-gate (v0.14.1): no native library may leave CI
      # without 16 KB ELF alignment — phones with 16 KB
      # memory pages (Galaxy S25 line and newer) refuse
      # such APKs at install time. This check makes the
      # v0.13.0 install failure impossible to ship again.
      - name: Verify 16 KB native alignment
        run: |
          python3 - << 'PYEOF'
          import struct, sys, zipfile
          z = zipfile.ZipFile(
              "app/build/outputs/apk/release/app-release.apk")
          bad = []
          for name in z.namelist():
              if not (name.startswith("lib/")
                      and name.endswith(".so")):
                  continue
              d = z.read(name)
              assert d[:4] == b"\x7fELF", name
              phoff = struct.unpack_from("<Q", d, 0x20)[0]
              phentsize = struct.unpack_from("<H", d, 0x36)[0]
              phnum = struct.unpack_from("<H", d, 0x38)[0]
              for i in range(phnum):
                  off = phoff + i * phentsize
                  if struct.unpack_from("<I", d, off)[0] == 1:
                      align = struct.unpack_from(
                          "<Q", d, off + 0x30)[0]
                      if align < 16384:
                          bad.append((name, align))
          if bad:
              print("NOT 16 KB aligned:", bad)
              sys.exit(1)
          print("16 KB alignment verified for all native libs")
          PYEOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymilo-native-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyMilo Native build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            MyMilo native Android app — RELEASE build, signed with the
            MyMilo release key (SHA-256 31:B7:29:2C:71:F4:2A:1A:B6:D6:
            61:EB:B4:F9:BD:87:F9:B2:1E:3C:62:37:B1:43:AE:FC:47:12:3B:
            13:F9:FE).

            IMPORTANT — build 10 is the first release-signed build:
            Android will NOT install it over the earlier debug builds
            (different signature). Uninstall the old MyMilo first,
            then install this one, then paste your device token once
            more. From build 10 on, updates install in place.

            Offline-first: local database, on-device skill matching,
            local tools; escalates to your MyMilo server for heavy
            models and search. Voice in/out with the phone's own
            speech engines; can serve as the device assistant; the
            in-app Updates section downloads new builds and keeps the
            Install button until you use it.
