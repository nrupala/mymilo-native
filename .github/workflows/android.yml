name: Build Android APK (native)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymilo-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyMilo Native build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            MyMilo native Android app (debug build for sideloading).

            Offline-first: local database, on-device skill matching,
            local tools; escalates to your MyMilo server for heavy
            models and search.

            Install: download app-debug.apk, open it on your phone,
            allow "install unknown apps" if prompted. First run:
            paste your device token (register on the server's
            Devices page).
